name: ochanomizu
version: 0.1.0.0
github: "githubuser/ochanomizu"
license: BSD-3-Clause
author: "Author name here"
maintainer: "example@example.com"
copyright: "2025 Author name here"

extra-source-files:
  - README.md
  - CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description: Please see the README on GitHub at <https://github.com/githubuser/ochanomizu#readme>

dependencies:
  - base >= 4.7 && < 5
  - hasktorch
  - hasktorch-tools
  - cassava
  - vector
  - bytestring
  - nlp-tools
  - utf8-string
  - containers
  - random
  - megaparsec
  - text
  - containers

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  dependencies:
    - base >= 4.7 && < 5
    - hasktorch
    - hasktorch-tools
    - bytestring
    - vector
    - split
    - aeson
    - utf8-string
    - containers

executables:
  ochanomizu-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - ochanomizu
      - bytestring
      - vector
      - split
      - hasktorch

  HyperbolicClassifier:
    main: Parser.hs
    source-dirs: src/HyperbolicClassifier
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - ochanomizu
      - aeson
      - bytestring
      - utf8-string
      - containers
      - megaparsec
      - text

tests:
  ochanomizu-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - ochanomizu
